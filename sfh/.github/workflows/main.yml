name: Build

on:
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sfh

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          - os: macos-latest
            targets: x86_64-apple-darwin aarch64-apple-darwin
          - os: windows-latest
            targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      # ── Binary release ────────────────────────────────────────────────
      - name: Install cross linkers (linux arm64)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build binaries
        shell: bash
        run: |
          mkdir -p dist
          for T in ${{ matrix.targets }}; do
            cargo build --release --target "$T"
            EXT=""
            case "$T" in windows-*) EXT=".exe" ;; esac
            case "$T" in
              x86_64-unknown-linux-gnu)  NAME=sfh_linux_amd64 ;;
              aarch64-unknown-linux-gnu) NAME=sfh_linux_arm64 ;;
              x86_64-apple-darwin)       NAME=sfh_darwin_amd64 ;;
              aarch64-apple-darwin)      NAME=sfh_darwin_arm64 ;;
              x86_64-pc-windows-msvc)    NAME=sfh_windows_amd64 ;;
              aarch64-pc-windows-msvc)   NAME=sfh_windows_arm64 ;;
            esac
            cp "target/$T/release/sfh$EXT" "dist/${NAME}${EXT}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tag
        id: tag
        run: |
          TAG="build-$(date -u +'%Y%m%d-%H%M%S')"
          git tag $TAG
          git push origin $TAG
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/*

  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ needs.release.outputs.tag }}
