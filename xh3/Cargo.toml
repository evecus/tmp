[package]
name = "xh3"
version = "0.1.0"
edition = "2021"
description = "A minimal HTTP/3 (QUIC) proxy: real-site camouflage server + SOCKS5 client (XHTTP-style sessions over h3)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "log"] }
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12", "dangerous_configuration"] }
sha2 = "0.10"
rustls-pki-types = "1"
rustls-pemfile = "2"
webpki-roots = "1"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
http = "1"
httpdate = "1"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
include_dir = "0.7"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.8"
base64 = "0.22"
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]

[lib]
name = "xh3"
path = "src/lib.rs"

[[bin]]
name = "xh3-server"
path = "src/bin/server.rs"

[[bin]]
name = "xh3-client"
path = "src/bin/client.rs"

[profile.release]
opt-level = 3
lto = "thin"
